<!DOCTYPE html>
<html>
<head>
  <title>Data Visualisation 2</title>
  <!-- These links act as a bridge, bringing Vega-Lite tools to your webpage -->
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  
  <h1>Animal Welfare in Australia</h1>
  
  <!-- This empty box is where your first map will appear -->
  <div id="my-first-map"></div>

  <!-- This script connects your JSON file to the empty box -->
  <script type="text/javascript">
    var spec1 = "map1.json";
    vegaEmbed('#my-first-map', spec1).then(function(result) {
      // Access the Vega view instance as result.view
    }).catch(console.error);
  </script>

</body>
</html>
